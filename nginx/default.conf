# ini testing untuk ssl
server {
    listen 80;
    server_name ujiansimawa.zik www.ujiansimawa.zik;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ujiansimawa.zik www.ujiansimawa.zik;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    ssl_certificate     /etc/nginx/ssl/ujiansimawa.zik+1.pem;
    ssl_certificate_key /etc/nginx/ssl/ujiansimawa.zik+1-key.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass simawa:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    location ~ /\.ht {
        deny all;
    }
}