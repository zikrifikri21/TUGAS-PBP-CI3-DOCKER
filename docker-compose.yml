version: '3.7'

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # aktifkan kalau mau skenario pake ssl
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro # aktifkan kalau mau skenario pake ssl
    environment:
      TZ: Asia/Makassar
    depends_on:
      - simawa

  simawa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      TZ: Asia/Makassar
    depends_on:
      - simawadb

  simawadb:
    image: mysql:5.7
    restart: unless-stopped
    volumes:
      - simawa-db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: simawadb
      MYSQL_USER: simawauser
      MYSQL_PASSWORD: simawapassword
      MYSQL_ROOT_PASSWORD: simawapassword

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "2121:80"
    environment:
      PMA_HOST: simawadb
      MYSQL_ROOT_PASSWORD: simawapassword
      UPLOAD_LIMIT: 64M
    depends_on:
      - simawadb

volumes:
  simawa-db: